<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FingAR - AR Finger Sketch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
 
        body {
            background: #000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.7;
        }

        #outputCanvas, #drawCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #drawCanvas {
            z-index: 10;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 0 20px;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.2s;
            min-width: 100px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.95);
        }

        .color-picker {
            position: absolute;
            bottom: 90px;
            left: 0;
            right: 0;
            display: flex;
            gap: 10px;
            justify-content: center;
            z-index: 100;
        }

        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid white;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-option.active {
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        .status {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 14px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            backdrop-filter: blur(5px);
        }

        .instruction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            z-index: 1000;
            max-width: 90%;
        }

        .instruction h3 {
            margin-bottom: 15px;
            font-size: 24px;
        }

        .instruction p {
            margin-bottom: 10px;
            font-size: 16px;
            opacity: 0.9;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
        }

        @media (max-width: 600px) {
            .btn {
                padding: 10px 20px;
                font-size: 14px;
                min-width: 80px;
            }

            .controls {
                gap: 10px;
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="outputCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>

        <div class="status" id="status">Tap screen to start</div>

        <div class="instruction" id="instruction">
            <button class="close-btn" onclick="closeInstruction()">×</button>
            <h3>🎨 FingAR</h3>
            <p>👆 Pinch index finger + thumb to draw</p>
            <p>🎨 Tap colors to change</p>
            <p>🗑️ Clear to start over</p>
            <p>✏️ Use Pencil mode to track objects</p>
            <p><strong>Tap anywhere to begin!</strong></p>
        </div>

        <div class="controls">
            <button class="btn" id="clearBtn">🗑️ Clear</button>
            <button class="btn" id="undoBtn">↩️ Undo</button>
            <button class="btn" id="cameraBtn">📷 Flip</button>
            <button class="btn" id="arBtn">✨ AR</button>
            <button class="btn" id="pencilBtn">✏️ Pencil</button>
        </div>

        <div class="color-picker" id="colorPicker">
            <div class="color-option active" style="background: #ff0000;" data-color="#ff0000"></div>
            <div class="color-option" style="background: #00ff00;" data-color="#00ff00"></div>
            <div class="color-option" style="background: #0000ff;" data-color="#0000ff"></div>
            <div class="color-option" style="background: #ffff00;" data-color="#ffff00"></div>
            <div class="color-option" style="background: #ff00ff;" data-color="#ff00ff"></div>
            <div class="color-option" style="background: #00ffff;" data-color="#00ffff"></div>
            <div class="color-option" style="background: #ffffff;" data-color="#ffffff"></div>
        </div>
    </div>

    <!-- MediaPipe Hands - Most reliable for mobile -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        // Global variables
        let video, outputCanvas, drawCanvas;
        let outputCtx, drawCtx;
        let hands = null;
        let camera = null;
        let isDrawing = false;
        let currentColor = '#ff0000';
        let lineWidth = 8;
        let useBackCamera = false;
        let isARMode = false;
        let drawingHistory = [];
        let currentStroke = [];
        let initialized = false;
        let lastDrawTime = 0;
        let currentDrawWidth = 8;
        
        // Pencil tracking variables
        let isPencilMode = false;
        let isCalibrating = false;
        let pencilTarget = { r: 0, g: 255, b: 0 }; // Default green
        let processCanvas, processCtx;

        // User must tap to start (for Android autoplay policies)
        document.addEventListener('click', async function initOnTap() {
            if (!initialized) {
                initialized = true;
                await init();
                document.removeEventListener('click', initOnTap);
            }
        }, { once: true });

        // Initialize app
        async function init() {
            updateStatus("Loading hand tracking...");

            // Get DOM elements
            video = document.getElementById('video');
            outputCanvas = document.getElementById('outputCanvas');
            drawCanvas = document.getElementById('drawCanvas');
            outputCtx = outputCanvas.getContext('2d');
            drawCtx = drawCanvas.getContext('2d');

            // Set canvas sizes to match screen
            resizeCanvas();

            // Setup processing canvas for pencil tracking
            processCanvas = document.createElement('canvas');
            processCanvas.width = 160; // Low res for performance
            processCanvas.height = 120;
            processCtx = processCanvas.getContext('2d', { willReadFrequently: true });

            try {
                // Initialize MediaPipe Hands
                hands = new Hands({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                    }
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                hands.onResults(onResults);

                // Start camera
                await startCamera();

                // Setup event listeners
                setupEventListeners();

                updateStatus("Ready! Pinch to draw 👆");

                // Hide instruction after 3 seconds
                setTimeout(() => {
                    closeInstruction();
                }, 3000);

            } catch (error) {
                updateStatus("Error: " + error.message);
                console.error(error);
            }
        }

        // Start camera with MediaPipe
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: useBackCamera ? 'environment' : 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });

                video.srcObject = stream;

                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });

                // Initialize camera for MediaPipe
                if (camera) {
                    camera.stop();
                }

                camera = new Camera(video, {
                    onFrame: async () => {
                        if (isPencilMode) {
                            processPencilTracking();
                        } else {
                            await hands.send({image: video});
                        }
                    },
                    width: 1280,
                    height: 720
                });

                camera.start();

            } catch (error) {
                updateStatus("Camera error: " + error.message);
                throw error;
            }
        }

        // Pencil Tracking Logic
        function processPencilTracking() {
            // Clear debug canvas
            outputCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
            
            if (isCalibrating) return;

            // Draw video to small process canvas
            const ratio = video.videoWidth / video.videoHeight;
            processCanvas.height = processCanvas.width / ratio;
            processCtx.drawImage(video, 0, 0, processCanvas.width, processCanvas.height);
            
            const frame = processCtx.getImageData(0, 0, processCanvas.width, processCanvas.height);
            const data = frame.data;
            const tolerance = 50; // Color match tolerance
            
            let sumX = 0, sumY = 0, count = 0;
            
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i+1];
                const b = data[i+2];
                
                // Simple Euclidean distance
                const dist = Math.sqrt(
                    Math.pow(r - pencilTarget.r, 2) +
                    Math.pow(g - pencilTarget.g, 2) +
                    Math.pow(b - pencilTarget.b, 2)
                );
                
                if (dist < tolerance) {
                    const pixelIdx = i / 4;
                    const x = pixelIdx % processCanvas.width;
                    const y = Math.floor(pixelIdx / processCanvas.width);
                    sumX += x;
                    sumY += y;
                    count++;
                }
            }
            
            if (count > 0) {
                // Average position (centroid)
                const avgX = sumX / count;
                const avgY = sumY / count;
                
                // Map back to screen coordinates
                const screenRatio = outputCanvas.width / outputCanvas.height;
                const videoRatio = video.videoWidth / video.videoHeight;
                
                let renderW, renderH, offsetX, offsetY;
                
                if (screenRatio > videoRatio) {
                    renderW = outputCanvas.width;
                    renderH = outputCanvas.width / videoRatio;
                    offsetX = 0;
                    offsetY = (outputCanvas.height - renderH) / 2;
                } else {
                    renderH = outputCanvas.height;
                    renderW = outputCanvas.height * videoRatio;
                    offsetX = (outputCanvas.width - renderW) / 2;
                    offsetY = 0;
                }
                
                // Map process canvas coords to render coords (Video is mirrored!)
                const normX = 1 - (avgX / processCanvas.width);
                const normY = avgY / processCanvas.height;
                
                const screenX = offsetX + (normX * renderW);
                const screenY = offsetY + (normY * renderH);
                
                // Draw logic
                if (!isDrawing) {
                    isDrawing = true;
                    currentStroke = [];
                    lastDrawTime = Date.now();
                    currentDrawWidth = lineWidth;
                    currentStroke.push({ type: 'start', x: screenX, y: screenY, color: currentColor, width: lineWidth });
                } else {
                    const now = Date.now();
                    const dt = now - lastDrawTime;
                    const lastPoint = currentStroke[currentStroke.length - 1];
                    const dist = Math.sqrt(Math.pow(screenX - lastPoint.x, 2) + Math.pow(screenY - lastPoint.y, 2));
                    const speed = dist / (dt || 1);

                    // Dynamic width: Faster = Thinner
                    const targetWidth = Math.max(2, Math.min(lineWidth * 1.5, lineWidth * 1.5 - (speed * 2)));
                    currentDrawWidth = currentDrawWidth * 0.6 + targetWidth * 0.4;

                    drawCtx.beginPath();
                    drawCtx.moveTo(lastPoint.x, lastPoint.y);
                    drawCtx.lineTo(screenX, screenY);
                    drawCtx.strokeStyle = currentColor;
                    drawCtx.lineWidth = currentDrawWidth;
                    drawCtx.stroke();
                    currentStroke.push({ type: 'line', x: screenX, y: screenY, width: currentDrawWidth });
                    lastDrawTime = now;
                }
                
                // Indicator
                outputCtx.fillStyle = currentColor;
                outputCtx.beginPath();
                outputCtx.arc(screenX, screenY, 10, 0, Math.PI * 2);
                outputCtx.fill();
            } else {
                isDrawing = false;
                if (currentStroke.length > 0) drawingHistory.push([...currentStroke]);
                currentStroke = [];
            }
        }

        // Process hand detection results
        function onResults(results) {
            // Clear debug canvas
            outputCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                // Get finger landmarks (MediaPipe uses normalized coordinates)
                const indexTip = landmarks[8];   // Index finger tip
                const thumbTip = landmarks[4];   // Thumb tip

                // Convert to screen coordinates
                const indexPos = {
                    x: indexTip.x * outputCanvas.width,
                    y: indexTip.y * outputCanvas.height
                };

                const thumbPos = {
                    x: thumbTip.x * outputCanvas.width,
                    y: thumbTip.y * outputCanvas.height
                };

                // Calculate pinch distance
                const distance = Math.sqrt(
                    Math.pow(indexPos.x - thumbPos.x, 2) + 
                    Math.pow(indexPos.y - thumbPos.y, 2)
                );

                // Pinch detection (drawing gesture)
                const pinchThreshold = 50;

                if (distance < pinchThreshold) {
                    if (!isDrawing) {
                        // Start new stroke
                        isDrawing = true;
                        currentStroke = [];
                        drawCtx.beginPath();
                        drawCtx.moveTo(indexPos.x, indexPos.y);

                        currentStroke.push({
                            type: 'start',
                            x: indexPos.x,
                            y: indexPos.y,
                            color: currentColor,
                            width: lineWidth
                        });
                    } else {
                        // Continue drawing
                        drawCtx.strokeStyle = currentColor;
                        drawCtx.lineWidth = lineWidth;
                        drawCtx.lineTo(indexPos.x, indexPos.y);
                        drawCtx.stroke();

                        currentStroke.push({
                            type: 'line',
                            x: indexPos.x,
                            y: indexPos.y
                        });
                    }

                    // Draw pinch indicator (green circle)
                    outputCtx.fillStyle = 'rgba(0, 255, 0, 0.6)';
                    outputCtx.beginPath();
                    outputCtx.arc(indexPos.x, indexPos.y, 20, 0, Math.PI * 2);
                    outputCtx.fill();

                } else {
                    if (isDrawing) {
                        // End stroke
                        isDrawing = false;
                        if (currentStroke.length > 0) {
                            drawingHistory.push([...currentStroke]);
                        }
                        currentStroke = [];
                    }

                    // Draw finger indicators
                    outputCtx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    outputCtx.beginPath();
                    outputCtx.arc(indexPos.x, indexPos.y, 15, 0, Math.PI * 2);
                    outputCtx.fill();

                    outputCtx.fillStyle = 'rgba(255, 255, 0, 0.5)';
                    outputCtx.beginPath();
                    outputCtx.arc(thumbPos.x, thumbPos.y, 15, 0, Math.PI * 2);
                    outputCtx.fill();
                }
            }
        }

        // Resize canvas to match screen
        function resizeCanvas() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            outputCanvas.width = width;
            outputCanvas.height = height;
            drawCanvas.width = width;
            drawCanvas.height = height;

            // Set drawing context properties
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            drawCtx.lineWidth = lineWidth;

            // Redraw if there's history
            if (drawingHistory.length > 0) {
                redrawHistory();
            }
        }

        // Setup event listeners
        function setupEventListeners() {
            // Window resize
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', () => {
                setTimeout(resizeCanvas, 100);
            });

            // Control buttons
            document.getElementById('clearBtn').addEventListener('click', clearCanvas);
            document.getElementById('undoBtn').addEventListener('click', undoLast);
            document.getElementById('cameraBtn').addEventListener('click', flipCamera);
            document.getElementById('arBtn').addEventListener('click', toggleARMode);
            document.getElementById('pencilBtn').addEventListener('click', togglePencilMode);
            document.getElementById('container').addEventListener('click', handleCalibration);

            // Color picker
            document.querySelectorAll('.color-option').forEach(option => {
                option.addEventListener('click', () => {
                    document.querySelectorAll('.color-option').forEach(opt => 
                        opt.classList.remove('active'));
                    option.classList.add('active');
                    currentColor = option.dataset.color;
                });
            });
        }

        // Control functions
        function clearCanvas() {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            drawingHistory = [];
            currentStroke = [];
            updateStatus("Canvas cleared");
        }

        function undoLast() {
            if (drawingHistory.length === 0) {
                updateStatus("Nothing to undo");
                return;
            }

            // Remove last stroke
            drawingHistory.pop();

            // Clear and redraw
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            redrawHistory();

            updateStatus("Undo last stroke");
        }

        function redrawHistory() {
            drawingHistory.forEach(stroke => {
                if (stroke.length > 0) {
                    const start = stroke[0];
                    let prevX = start.x;
                    let prevY = start.y;
                    let prevWidth = start.width;

                    drawCtx.strokeStyle = start.color;

                    for (let i = 1; i < stroke.length; i++) {
                        const point = stroke[i];
                        if (point.type === 'line') {
                            drawCtx.beginPath();
                            drawCtx.moveTo(prevX, prevY);
                            drawCtx.lineTo(point.x, point.y);
                            drawCtx.lineWidth = point.width || prevWidth;
                            drawCtx.stroke();
                            prevX = point.x;
                            prevY = point.y;
                            prevWidth = point.width || prevWidth;
                        }
                    }
                }
            });
        }

        async function flipCamera() {
            useBackCamera = !useBackCamera;
            updateStatus("Flipping camera...");

            // Stop current camera
            if (camera) {
                camera.stop();
            }

            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }

            // Restart with new camera
            await startCamera();
            updateStatus(useBackCamera ? "Back camera" : "Front camera");
        }

        function toggleARMode() {
            isARMode = !isARMode;
            video.style.opacity = isARMode ? '0.3' : '0.7';
            document.getElementById('arBtn').textContent = isARMode ? '📸 Normal' : '✨ AR';
            updateStatus(isARMode ? "AR Mode" : "Normal Mode");
        }

        function togglePencilMode() {
            isPencilMode = !isPencilMode;
            const btn = document.getElementById('pencilBtn');
            
            if (isPencilMode) {
                btn.style.background = '#4CAF50'; // Green to show active
                isCalibrating = true;
                updateStatus("Tap the pencil tip on screen to calibrate!");
                clearCanvas();
            } else {
                btn.style.background = ''; // Reset
                isCalibrating = false;
                updateStatus("Hand mode active");
            }
        }

        function handleCalibration(e) {
            if (!isPencilMode || !isCalibrating) return;
            
            // Don't trigger if clicking controls
            if (e.target.closest('.controls') || e.target.closest('.color-picker')) return;

            // Capture color from video at click location
            const ratio = video.videoWidth / video.videoHeight;
            
            // Create a temp canvas to read the full video frame
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(video, 0, 0);
            
            // Calculate click position relative to video
            const screenRatio = window.innerWidth / window.innerHeight;
            let renderW, renderH, offsetX, offsetY;
            
            if (screenRatio > ratio) {
                renderW = window.innerWidth;
                renderH = window.innerWidth / ratio;
                offsetX = 0;
                offsetY = (window.innerHeight - renderH) / 2;
            } else {
                renderH = window.innerHeight;
                renderW = window.innerHeight * ratio;
                offsetX = (window.innerWidth - renderW) / 2;
                offsetY = 0;
            }
            
            // Map click to video coords (handling mirror)
            const normX = 1 - ((e.clientX - offsetX) / renderW);
            const normY = (e.clientY - offsetY) / renderH;
            
            const vidX = Math.max(0, Math.min(video.videoWidth - 1, Math.floor(normX * video.videoWidth)));
            const vidY = Math.max(0, Math.min(video.videoHeight - 1, Math.floor(normY * video.videoHeight)));
            
            const pixel = tempCtx.getImageData(vidX, vidY, 1, 1).data;
            pencilTarget = { r: pixel[0], g: pixel[1], b: pixel[2] };
            
            isCalibrating = false;
            updateStatus("Pencil calibrated! Start drawing.");
            
            // Visual feedback
            const btn = document.getElementById('pencilBtn');
            btn.style.borderColor = `rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
        }

        // UI Helper functions
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }

        function closeInstruction() {
            document.getElementById('instruction').style.display = 'none';
        }

        // Prevent zoom on double-tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
