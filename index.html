<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AR Finger Sketch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            background: #000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        #container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.7;
        }
        
        #outputCanvas, #drawCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #drawCanvas {
            z-index: 10;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 0 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.2s;
            min-width: 100px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn:hover, .btn:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
        
        .color-picker {
            position: absolute;
            bottom: 90px;
            left: 0;
            right: 0;
            display: flex;
            gap: 10px;
            justify-content: center;
            z-index: 100;
        }
        
        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid white;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .color-option.active {
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }
        
        .status {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 14px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            backdrop-filter: blur(5px);
        }
        
        .debug {
            position: absolute;
            top: 60px;
            left: 10px;
            color: lime;
            font-size: 12px;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 5px;
            z-index: 100;
            max-width: 200px;
            word-break: break-all;
            display: none;
        }
        
        .instruction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            z-index: 1000;
            max-width: 90%;
        }
        
        .instruction h3 {
            margin-bottom: 15px;
            font-size: 24px;
        }
        
        .instruction p {
            margin-bottom: 10px;
            font-size: 16px;
            opacity: 0.9;
        }
        
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        @media (max-width: 600px) {
            .btn {
                padding: 10px 20px;
                font-size: 14px;
                min-width: 80px;
            }
            
            .controls {
                gap: 10px;
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="video" playsinline autoplay></video>
        <canvas id="outputCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
        
        <div class="status" id="status">Initializing...</div>
        <div class="debug" id="debug"></div>
        
        <div class="instruction" id="instruction">
            <button class="close-btn" onclick="closeInstruction()">×</button>
            <h3>AR Finger Sketch</h3>
            <p>👆 Pinch your index finger and thumb together to draw</p>
            <p>🎨 Tap colors to change drawing color</p>
            <p>🗑️ Clear to start over</p>
            <p>📱 Works best on mobile devices</p>
            <p>Click anywhere to begin!</p>
        </div>
        
        <div class="controls">
            <button class="btn" id="clearBtn">🗑️ Clear</button>
            <button class="btn" id="undoBtn">↩️ Undo</button>
            <button class="btn" id="cameraBtn">📷 Flip</button>
            <button class="btn" id="arBtn">✨ AR Mode</button>
        </div>
        
        <div class="color-picker" id="colorPicker">
            <div class="color-option active" style="background: #ff0000;" data-color="#ff0000"></div>
            <div class="color-option" style="background: #00ff00;" data-color="#00ff00"></div>
            <div class="color-option" style="background: #0000ff;" data-color="#0000ff"></div>
            <div class="color-option" style="background: #ffff00;" data-color="#ffff00"></div>
            <div class="color-option" style="background: #ff00ff;" data-color="#ff00ff"></div>
            <div class="color-option" style="background: #00ffff;" data-color="#00ffff"></div>
            <div class="color-option" style="background: #ffffff;" data-color="#ffffff"></div>
        </div>
    </div>

    <script>
        // Global variables
        let video, outputCanvas, drawCanvas;
        let outputCtx, drawCtx;
        let model = null;
        let predictions = [];
        let isDrawing = false;
        let currentColor = '#ff0000';
        let lineWidth = 8;
        let useBackCamera = false; // Start with front camera for easier hand positioning
        let isARMode = false;
        let drawingHistory = [];
        let lastPoint = { x: 0, y: 0 };
        
        // Initialize app
        async function init() {
            updateStatus("Loading hand tracking model...");
            
            // Get DOM elements
            video = document.getElementById('video');
            outputCanvas = document.getElementById('outputCanvas');
            drawCanvas = document.getElementById('drawCanvas');
            outputCtx = outputCanvas.getContext('2d');
            drawCtx = drawCanvas.getContext('2d');
            
            // Set canvas sizes to match screen
            resizeCanvas();
            
            try {
                // Load TensorFlow.js and Handpose model from CDN
                await loadTensorFlow();
                model = await loadHandposeModel();
                
                // Start camera
                await startCamera();
                
                // Setup event listeners
                setupEventListeners();
                
                // Start hand detection loop
                updateStatus("Ready! Pinch to draw 👆");
                detectHand();
                
            } catch (error) {
                updateStatus("Error: " + error.message);
                console.error(error);
            }
        }
        
        // Load TensorFlow.js from CDN
        function loadTensorFlow() {
            return new Promise((resolve, reject) => {
                if (typeof tf !== 'undefined') {
                    resolve();
                    return;
                }
                
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js';
                script.onload = resolve;
                script.onerror = () => reject(new Error('Failed to load TensorFlow.js'));
                document.head.appendChild(script);
            });
        }
        
        // Load Handpose model from CDN
        async function loadHandposeModel() {
            await new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.0.7/dist/handpose.min.js';
                script.onload = resolve;
                script.onerror = () => reject(new Error('Failed to load Handpose'));
                document.head.appendChild(script);
            });
            
            if (typeof handpose !== 'undefined') {
                return await handpose.load();
            } else {
                throw new Error('Handpose model failed to load');
            }
        }
        
        // Start camera
        async function startCamera() {
            const constraints = {
                video: {
                    facingMode: useBackCamera ? 'environment' : 'user',
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                    frameRate: { ideal: 30 }
                }
            };
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                await video.play();
            } catch (error) {
                updateStatus("Camera error: " + error.message);
                throw error;
            }
        }
        
        // Resize canvas to match screen
        function resizeCanvas() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            outputCanvas.width = width;
            outputCanvas.height = height;
            drawCanvas.width = width;
            drawCanvas.height = height;
            
            // Set drawing context properties
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            drawCtx.lineWidth = lineWidth;
        }
        
        // Setup event listeners
        function setupEventListeners() {
            // Window resize
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', resizeCanvas);
            
            // Control buttons
            document.getElementById('clearBtn').addEventListener('click', clearCanvas);
            document.getElementById('undoBtn').addEventListener('click', undoLast);
            document.getElementById('cameraBtn').addEventListener('click', flipCamera);
            document.getElementById('arBtn').addEventListener('click', toggleARMode);
            
            // Color picker
            document.querySelectorAll('.color-option').forEach(option => {
                option.addEventListener('click', () => {
                    document.querySelectorAll('.color-option').forEach(opt => 
                        opt.classList.remove('active'));
                    option.classList.add('active');
                    currentColor = option.dataset.color;
                });
            });
            
            // Close instruction on tap
            document.addEventListener('click', closeInstruction, { once: true });
        }
        
        // Hand detection loop
        async function detectHand() {
            if (!model || video.readyState !== 4) {
                requestAnimationFrame(detectHand);
                return;
            }
            
            // Clear debug canvas
            outputCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
            
            try {
                // Detect hands
                predictions = await model.estimateHands(video, {
                    flipHorizontal: !useBackCamera
                });
                
                if (predictions.length > 0) {
                    const hand = predictions[0];
                    
                    // Get finger landmarks
                    const landmarks = hand.landmarks;
                    
                    // Transform landmarks to screen coordinates
                    const indexTip = transformLandmark(landmarks[8]); // Index finger tip
                    const thumbTip = transformLandmark(landmarks[4]); // Thumb tip
                    
                    // Calculate pinch distance
                    const distance = Math.sqrt(
                        Math.pow(indexTip.x - thumbTip.x, 2) + 
                        Math.pow(indexTip.y - thumbTip.y, 2)
                    );
                    
                    // Draw debug landmarks
                    if (document.getElementById('debug').style.display !== 'none') {
                        drawLandmarks(landmarks);
                    }
                    
                    // Pinch detection (drawing gesture)
                    const pinchThreshold = 40;
                    if (distance < pinchThreshold) {
                        if (!isDrawing) {
                            isDrawing = true;
                            drawingHistory.push({
                                type: 'start',
                                color: currentColor,
                                width: lineWidth
                            });
                            drawCtx.beginPath();
                            drawCtx.moveTo(indexTip.x, indexTip.y);
                        }
                        
                        // Draw line
                        drawCtx.strokeStyle = currentColor;
                        drawCtx.lineWidth = lineWidth;
                        drawCtx.lineTo(indexTip.x, indexTip.y);
                        drawCtx.stroke();
                        
                        // Store for undo
                        if (lastPoint.x !== indexTip.x || lastPoint.y !== indexTip.y) {
                            drawingHistory.push({
                                type: 'line',
                                points: [lastPoint.x, lastPoint.y, indexTip.x, indexTip.y],
                                color: currentColor,
                                width: lineWidth
                            });
                        }
                        
                        lastPoint = { x: indexTip.x, y: indexTip.y };
                        
                        // Draw pinch indicator
                        outputCtx.fillStyle = 'rgba(0, 255, 0, 0.5)';
                        outputCtx.beginPath();
                        outputCtx.arc(indexTip.x, indexTip.y, 20, 0, Math.PI * 2);
                        outputCtx.fill();
                    } else {
                        isDrawing = false;
                    }
                    
                    // Update debug info
                    updateDebug(`Hands: ${predictions.length}, Pinch: ${Math.round(distance)}`);
                }
                
            } catch (error) {
                console.error('Detection error:', error);
            }
            
            // Continue loop
            requestAnimationFrame(detectHand);
        }
        
        // Transform landmark to screen coordinates
        function transformLandmark(landmark) {
            const videoRatio = video.videoWidth / video.videoHeight;
            const screenRatio = window.innerWidth / window.innerHeight;
            
            let x, y;
            
            if (videoRatio > screenRatio) {
                // Video is wider than screen
                const scale = window.innerWidth / video.videoWidth;
                x = landmark[0] * scale;
                y = (landmark[1] - (video.videoHeight - window.innerHeight / scale) / 2) * scale;
            } else {
                // Video is taller than screen
                const scale = window.innerHeight / video.videoHeight;
                x = (landmark[0] - (video.videoWidth - window.innerWidth / scale) / 2) * scale;
                y = landmark[1] * scale;
            }
            
            // Mirror x coordinate if using front camera
            if (!useBackCamera) {
                x = window.innerWidth - x;
            }
            
            return { x, y };
        }
        
        // Draw landmarks for debugging
        function drawLandmarks(landmarks) {
            outputCtx.fillStyle = 'rgba(255, 0, 0, 0.7)';
            
            landmarks.forEach(landmark => {
                const pos = transformLandmark(landmark);
                outputCtx.beginPath();
                outputCtx.arc(pos.x, pos.y, 4, 0, Math.PI * 2);
                outputCtx.fill();
            });
        }
        
        // Control functions
        function clearCanvas() {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            drawingHistory = [];
            updateStatus("Canvas cleared");
        }
        
        function undoLast() {
            if (drawingHistory.length === 0) return;
            
            // Find the last complete stroke (from start to before next start)
            let lastStartIndex = -1;
            for (let i = drawingHistory.length - 1; i >= 0; i--) {
                if (drawingHistory[i].type === 'start') {
                    lastStartIndex = i;
                    break;
                }
            }
            
            if (lastStartIndex >= 0) {
                // Remove everything from last start onwards
                drawingHistory.splice(lastStartIndex);
                
                // Redraw everything
                drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
                redrawHistory();
                updateStatus("Undo last stroke");
            }
        }
        
        function redrawHistory() {
            drawingHistory.forEach(step => {
                if (step.type === 'start') {
                    drawCtx.beginPath();
                    drawCtx.strokeStyle = step.color;
                    drawCtx.lineWidth = step.width;
                } else if (step.type === 'line') {
                    drawCtx.moveTo(step.points[0], step.points[1]);
                    drawCtx.lineTo(step.points[2], step.points[3]);
                    drawCtx.stroke();
                }
            });
        }
        
        async function flipCamera() {
            useBackCamera = !useBackCamera;
            
            // Stop current stream
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            
            // Start new camera
            await startCamera();
            updateStatus("Camera flipped");
        }
        
        function toggleARMode() {
            isARMode = !isARMode;
            video.style.opacity = isARMode ? '0.3' : '0.7';
            document.getElementById('arBtn').textContent = isARMode ? '📸 Normal' : '✨ AR Mode';
            updateStatus(isARMode ? "AR Mode: Camera dimmed" : "Normal Mode");
        }
        
        // UI Helper functions
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }
        
        function updateDebug(message) {
            document.getElementById('debug').textContent = message;
        }
        
        function closeInstruction() {
            document.getElementById('instruction').style.display = 'none';
            document.getElementById('debug').style.display = 'block';
        }
        
        // Initialize on load
        window.addEventListener('load', init);
        
        // Prevent default touch behaviors for better mobile experience
        document.addEventListener('touchstart', (e) => {
            if (e.target.closest('.btn') || e.target.closest('.color-option')) {
                return; // Allow button clicks
            }
        }, { passive: true });
    </script>
</body>
</html>
